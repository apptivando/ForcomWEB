name: Automations cron

# Reemplaza a los Cron Jobs de Vercel (ocupados por otro proyecto).
# Cada 5 minutos le pega a dos endpoints:
#   - /api/cron/automations → las automatizaciones con pasos "wait"
#     siguen solas donde quedaron.
#   - /api/cron/prospects   → enriquece un lote de prospectos (visita
#     sus sitios para sacarles email, WhatsApp y redes).
# GitHub no garantiza el minuto exacto bajo carga — está bien, no es
# un caso de uso que necesite precisión al segundo. El enriquecedor ya
# está preparado para corridas solapadas (reclama con SKIP LOCKED).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # para poder correrlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de automatizaciones
        run: |
          curl -sf --max-time 120 -X GET "https://dev.forcom.tech/api/cron/automations" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
        # TODO: cambiar a https://www.forcom.tech/api/cron/automations
        # cuando el Track E se mergee de develop a main.

      # Va después y con `if: always()` para que un fallo de las
      # automatizaciones no deje la cola de prospectos sin procesar.
      # El --max-time acompaña al presupuesto de 240s del endpoint.
      - name: Enriquecer prospectos
        if: always()
        run: |
          curl -sf --max-time 300 -X GET "https://dev.forcom.tech/api/cron/prospects" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
